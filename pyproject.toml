[project]
name = "schedule-optimizer-agent"
version = "0.1.0"
description = "Comprehensive construction schedule analyzer with AI agent"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "networkx>=3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["models*", "parsers*", "optimization*", "agent*"]

[tool.pyright]
extraPaths = ["."]